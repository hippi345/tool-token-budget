name: Tool Token Budget CI

# Note: Cursor Origin PRs for this repository do not run GitHub Actions workflows yet.
# This workflow runs for GitHub pull_request/push events on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build tool-token-budget
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Analyze fixture - should pass
        if: matrix.os == "ubuntu-latest"
        run: |
          node dist/cli.js analyze \
            --tools-json fixtures/tools-tiny.json \
            --budget 100

      - name: Analyze bloated fixture - expect warnings
        if: matrix.os == "ubuntu-latest"
        run: |
          node dist/cli.js analyze \
            --tools-json fixtures/tools-bloated.json \
            --fail-on error
        continue-on-error: false

      - name: Lint server - author mode (should fail on bloat)
        if: matrix.os == "ubuntu-latest"
        run: |
          node dist/cli.js lint-server \
            --tools-json fixtures/tools-bloated.json \
            --fail-on warn || echo "Expected failure on bloated fixture"

      - name: Generate report artifacts
        if: matrix.os == "ubuntu-latest"
        run: |
          node dist/cli.js emit \
            --tools-json fixtures/tools-bloated.json \
            --out ./tool-token-budget-reports \
            --keep-hot 3
          node dist/cli.js analyze \
            --tools-json fixtures/tools-bloated.json \
            --sarif ./tool-token-budget-reports/tool-token-budget.sarif

      - name: Upload tool token budget report
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == "ubuntu-latest"
        with:
          name: tool-token-budget-report
          path: |
            tool-token-budget-reports/report.json
            tool-token-budget-reports/defer-hints.json
            tool-token-budget-reports/tool-token-budget.keep.json
            tool-token-budget-reports/tool-token-budget.sarif

      - name: Display savings summary
        if: matrix.os == "ubuntu-latest"
        run: |
          echo "## Tool Token Budget Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Savings Analysis" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat tool-token-budget-reports/report.json | jq '.savings' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  sarif-and-pr-comment:
    name: SARIF upload and PR comment (Ubuntu)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-token-budget-report
          path: tool-token-budget-reports

      - name: Upload SARIF to GitHub Code Scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tool-token-budget-reports/tool-token-budget.sarif
          category: tool-token-budget

      - name: Post savings summary on pull request
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const report = JSON.parse(
              fs.readFileSync(
                "tool-token-budget-reports/report.json",
                "utf8"
              )
            );
            const savings = report.savings ?? {};
            const body = [
              "## Tool Token Budget (CI)",
              "",
              "Savings snapshot from `fixtures/tools-bloated.json` with `--keep-hot 3`:",
              "",
              "```json",
              JSON.stringify(savings, null, 2),
              "```",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  e2e:
    name: E2E tests (Ubuntu only)
    runs-on: ubuntu-latest
    # E2E with Playwright on Windows CI is impractical (browser install overhead)
    # Run unit tests on both OS, e2e on ubuntu only
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build tool-token-budget
        run: npm run build

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
